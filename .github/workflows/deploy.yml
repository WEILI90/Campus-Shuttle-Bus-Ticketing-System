name: CD - Deploy Application

# Reusable workflow (workflow_call) - invoked by ci.yml, but also kept
# independently manually runnable (workflow_dispatch). Never auto-triggered on
# push. Deploying always applies infra first (job `infra` below, which calls
# build.yml) so the `app` job never targets instances/an ASG that don't exist
# yet or are out of date - that's the sequencing this workflow guarantees.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: shuttle-bus-ticketing
  ARTIFACT_PREFIX: artifacts
  APP_TAG: assignment-shuttle-bus


jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    runs-on: ubuntu-latest
    # Bucket name comes from the infra job's terraform output, not a hardcoded
    # value - keeps this in lockstep with the account-ID-suffixed bucket name.
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
      ASG_NAME: ${{ needs.infra.outputs.asg_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install app dependencies (if Composer is configured)
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --optimize-autoloader
          else
            echo "No composer.json in $PWD; skipping Composer install for this PHP app."
          fi

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip . -x "uploads/*"

      - name: Upload artifact to S3
        run: |
          aws s3 cp assignment-app.zip \
            "s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip"

      # AWS Academy accounts may deny SSM registration and StartInstanceRefresh.
      # Recycle the existing instances one at a time so the ASG launches them
      # from the latest launch template; user-data pulls the artifact from S3.
      - name: Replace instances without SSM
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No healthy InService instances found in ASG $ASG_NAME"
            exit 1
          fi

          for old_id in $INSTANCE_IDS; do
            echo "Replacing $old_id"
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id "$old_id" \
              --no-should-decrement-desired-capacity

            for i in $(seq 1 30); do
              HEALTHY_IDS=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$ASG_NAME" \
                --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'].InstanceId" \
                --output text)
              HEALTHY_COUNT=$(printf '%s\n' "$HEALTHY_IDS" | wc -w)
              echo "Healthy instances ($HEALTHY_COUNT/2): $HEALTHY_IDS"
              if [ "$HEALTHY_COUNT" -ge 2 ]; then
                break
              fi
              sleep 10
            done

            if [ "$HEALTHY_COUNT" -lt 2 ]; then
              echo "Timed out waiting for the replacement of $old_id."
              exit 1
            fi
          done
